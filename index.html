<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發送誤裝訂統計分析</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#006300; --bad:#d03b3b; --accent:#2a78d6;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --bad:#e66767; --accent:#3987e5;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  font-size: 14px; line-height: 1.5;
}
a { color: var(--accent); }
/* 互動狀態（全站）：轉場、hover、按壓回饋、鍵盤焦點 */
button, .iconbtn, .btn, .seg button, nav.tabs button, h3.collh, .controls input, .controls select {
  transition: background-color .18s, color .18s, border-color .18s, box-shadow .18s, transform .1s, filter .18s;
}
.iconbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:hover:not(:disabled) { filter: brightness(1.07); box-shadow: 0 2px 10px rgba(42,120,214,.25); }
.btn.ghost:hover:not(:disabled) { background: rgba(42,120,214,.08); box-shadow: none; }
.seg button:hover:not(.on) { color: var(--ink); background: rgba(137,135,129,.12); }
.btn:active, .iconbtn:active, .seg button:active, nav.tabs button:active { transform: translateY(1px); }
:is(button, input, select, a, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 16px 22px; }
header.top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
header.top h1 { font-size: 21px; font-weight: 700; letter-spacing: -.2px; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.iconbtn { border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:13px; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }
.seg button { border:0; background:transparent; color:var(--ink-2); padding:6px 12px; cursor:pointer; font-size:13px; }
.seg button.on { background: var(--accent); color: #fff; }
nav.tabs { display:flex; gap:6px; margin: 8px 0 16px; overflow-x:auto; position:sticky; top:0; z-index:40; background:var(--page); padding:8px 0; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs button { border:1px solid var(--border); background:var(--surface); color:var(--ink-2); padding:8px 16px; border-radius:10px; cursor:pointer; font-size:14px; white-space:nowrap; flex-shrink:0; }
nav.tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:14px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
.card .k { color:var(--muted); font-size:12px; }
.card .v { font-size:26px; font-weight:700; margin:2px 0; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
.card .d { font-size:12px; color:var(--ink-2); }
.card .d .up { color:var(--bad); } .card .d .down { color:var(--good); }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
.panel h3 { font-size:14px; font-weight:700; margin-bottom:2px; }
.panel .hint { color:var(--muted); font-size:12px; margin-bottom:8px; }
.chart { position:relative; }
.legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin:6px 0 2px; font-size:12px; color:var(--ink-2); }
.legend .it { display:inline-flex; align-items:center; gap:5px; }
.legend .sw { width:10px; height:10px; border-radius:3px; display:inline-block; }
.tooltip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(28,38,58,.20); padding:8px 10px; font-size:12px; z-index:30; display:none; min-width:120px; }
.tooltip .tt-t { font-weight:700; margin-bottom:4px; }
.tooltip .row { display:flex; align-items:center; gap:6px; justify-content:space-between; }
.tooltip .row b { font-variant-numeric: tabular-nums; }
table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th { text-align:left; color:var(--muted); font-weight:600; padding:7px 8px; border-bottom:1px solid var(--grid); white-space:nowrap; }
table.tbl td { padding:7px 8px; border-bottom:1px solid var(--grid); white-space:nowrap; font-variant-numeric:tabular-nums; }
table.tbl tr:last-child td { border-bottom:0; }
table.tbl td.num, table.tbl th.num { text-align:right; }
tr.replied td { background: rgba(12,163,12,.12); }
tr.replied td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.replied td.rcell { color: var(--good); font-weight:600; }
/* 彰化查件清單：專業表格（例外醒目 — 未回覆才強調） */
.cqwrap { max-height: 620px; overflow: auto; border: 1px solid var(--grid); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.cqwrap table.tbl { border-collapse: separate; border-spacing: 0; }
.cqwrap thead th { position: sticky; top: 0; background: var(--surface); z-index: 5; box-shadow: 0 1px 0 var(--grid); padding: 9px 9px; }
.cqwrap thead th.sortth { user-select: none; }
.cqwrap thead th.sortth:hover { color: var(--accent); background: rgba(42,120,214,.08); }
table.cqt th, table.cqt td { white-space: nowrap; }
table.cqt td { padding: 7px 9px; border-bottom: 1px solid var(--grid); }
table.cqt tbody tr:nth-child(even) td { background: rgba(137,135,129,.055); }
table.cqt tbody tr:hover td { background: rgba(42,120,214,.09); }
table.cqt td.wrapcol { white-space: normal; min-width: 170px; max-width: 250px; line-height: 1.35; font-size: 12.5px; }
tr.rowdone td:first-child { box-shadow: inset 3px 0 0 var(--good); }
tr.rowpend td { background: rgba(237,161,0,.09) !important; }
tr.rowpend td:first-child { box-shadow: inset 3px 0 0 var(--s4); }
.upill { display:inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; border: 1.5px solid; }
.cqprog { display:inline-flex; align-items:center; gap:8px; }
.cqprog .bar { width: 130px; height: 8px; border-radius: 5px; background: var(--grid); overflow: hidden; display:inline-block; }
.cqprog .bar > i { display:block; height: 100%; background: var(--good); }
/* 自製日曆選擇器（彰化追蹤）：有資料日期亮起＋件數、無資料反灰 */
.calbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 2px; position:relative; }
.calbtn { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums; }
.calbtn:hover { border-color:var(--accent); color:var(--accent); }
.calpop { position:absolute; top:calc(100% + 6px); left:0; z-index:60; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 34px rgba(28,38,58,.28); padding:12px; width:308px; user-select:none; }
.calpop .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; padding:0 2px; }
.calpop .calhead b { font-size:14px; font-variant-numeric:tabular-nums; }
.calpop .calnav { display:flex; gap:4px; }
.calpop .calnav button { border:1px solid var(--border); background:transparent; color:var(--ink-2); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1; }
.calpop .calnav button:hover:not(:disabled) { color:var(--accent); border-color:var(--accent); }
.calpop .calnav button:disabled { opacity:.3; cursor:default; }
.calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.calgrid .wd { text-align:center; font-size:11px; color:var(--muted); padding:4px 0 6px; font-weight:600; }
.calgrid .day { position:relative; height:40px; border:0; background:transparent; border-radius:9px; font-size:13px; color:var(--ink); cursor:pointer; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }
.calgrid .day .n { font-size:9.5px; line-height:1.1; color:var(--accent); font-weight:700; }
.calgrid .day:hover:not(:disabled) { background:rgba(42,120,214,.12); }
.calgrid .day:disabled { color:var(--muted); opacity:.35; cursor:default; }
.calgrid .day.out { opacity:.2; }
.calgrid .day.today { box-shadow:inset 0 0 0 1.5px var(--axis); }
.calgrid .day.sel { background:var(--accent); color:#fff; }
.calgrid .day.sel .n { color:#fff; }
.calfoot { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--grid); }
.calfoot button { border:0; background:transparent; color:var(--accent); cursor:pointer; font-size:13px; font-weight:600; padding:4px 8px; border-radius:6px; }
.calfoot button:hover { background:rgba(42,120,214,.10); }
.calmask { display:none; }
@media (max-width: 640px) {
  .calmask { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:59; }
  .calpop { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(332px, calc(100vw - 28px)); }
  .calgrid .day { height:44px; font-size:14px; }
}
/* 發轉滑道分析：月台平面熱度圖 */
.fzmap { display:flex; gap:3px; overflow-x:auto; padding:6px 2px 8px; -webkit-overflow-scrolling:touch; }
.fzmap .ch { flex:0 0 40px; border:1px solid var(--grid); border-radius:7px; padding:4px 2px 5px; text-align:center; cursor:pointer; background:var(--surface); transition:outline-color .15s, transform .1s; }
.fzmap .ch:hover { transform:translateY(-1px); }
.fzmap .ch.sel { outline:2px solid var(--accent); }
.fzmap .ch .no { font-size:10.5px; color:var(--muted); font-weight:700; }
.fzmap .ch .n { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; }
.fzmap .ch .cds { font-size:8.5px; color:var(--ink-2); line-height:1.2; word-break:break-all; min-height:10px; }
.fzbelt { height:8px; border-radius:4px; background:repeating-linear-gradient(90deg, var(--axis) 0 14px, var(--grid) 14px 28px); margin:2px 0 6px; }
@media (max-width:640px){ .fzmap .ch { flex:0 0 36px; } }
/* 責任歸咎總覽：單位 KPI 卡（左色條＋大數字＋走勢） */
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:10px; margin:10px 0 6px; }
.kpi { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px 9px 16px; overflow:hidden; }
.kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--kc,var(--accent)); }
.kpi .k { font-size:12px; color:var(--muted); font-weight:600; }
.kpi .v { font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.4px; line-height:1.15; }
.kpi .v small { font-size:12px; color:var(--muted); font-weight:600; letter-spacing:0; margin-left:2px; }
.kpi .d { font-size:11.5px; color:var(--ink-2); margin-top:1px; font-variant-numeric:tabular-nums; }
.kpi .d .up { color:var(--bad); font-weight:700; } .kpi .d .down { color:var(--good); font-weight:700; }
.kpi svg.spark { position:absolute; right:10px; top:12px; opacity:.85; }
/* 可收合面板 */
h3.collh { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 7px; }
h3.collh .car { transition: transform .15s; color: var(--muted); font-size: 11px; display: inline-block; }
h3.collh.closed .car { transform: rotate(-90deg); }
h3.collh:hover { color: var(--accent); }
/* 樞紐分析 */
.pvrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.pvrow .lbl { width: 64px; text-align: right; font-size: 12px; font-weight: 700; }
.pvrow .track { flex: 1; height: 18px; display: flex; gap: 2px; border-radius: 4px; overflow: hidden; }
.pvrow .seg { height: 100%; min-width: 3px; cursor: default; }
.pvrow .tot { width: 56px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
table.pvmx td.cell { cursor: pointer; }
table.pvmx td.cell:hover { background: rgba(42,120,214,.12); }
.tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.hl { font-weight:700; color:var(--accent); }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid var(--border); color:var(--ink-2); }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:end; }
.controls label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
.controls input, .controls select { border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:6px 8px; font-size:13px; min-width:0; }
.controls input[type=date] { width:140px; }
.btn { border:0; background:var(--accent); color:#fff; border-radius:8px; padding:8px 18px; cursor:pointer; font-size:14px; font-weight:600; }
.btn:disabled { opacity:.5; cursor:default; }
.btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
.drop { border:2px dashed var(--axis); border-radius:14px; padding:40px 20px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
.drop.over { border-color:var(--accent); color:var(--accent); background:rgba(42,120,214,.06); }
.progress { height:10px; border-radius:6px; background:var(--grid); overflow:hidden; margin:10px 0; }
.progress > div { height:100%; background:var(--accent); width:0%; transition:width .2s; }
.msg-ok { color:var(--good); font-weight:600; }
.msg-err { color:var(--bad); font-weight:600; }
.pager { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:13px; color:var(--ink-2); }
#gate { position:fixed; inset:0; background:var(--page); z-index:100; display:flex; align-items:center; justify-content:center; }
#gate .box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:34px 30px; width:320px; text-align:center; }
#gate h2 { font-size:18px; margin-bottom:4px; }
#gate p { color:var(--muted); font-size:13px; margin-bottom:16px; }
#gate input { width:100%; text-align:center; font-size:22px; letter-spacing:8px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--page); color:var(--ink); margin-bottom:12px; }
.loading { color:var(--muted); text-align:center; padding:30px 0; }
svg text { font-family: inherit; }
/* 列印報表（A4 橫式） */
#printArea { display: none; }
@media print {
  @page { size: A4 landscape; margin: 9mm; }
  body.printing .wrap, body.printing .tooltip, body.printing #fillModal { display: none !important; }
  body.printing { background: #fff !important; }
  body.printing #printArea { display: block !important; color: #000; }
  #printArea * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printArea h1 { font-size: 16pt; margin: 0 0 2px; }
  #printArea .pmeta { font-size: 10pt; color: #333; margin-bottom: 8px; }
  #printArea .psec { font-size: 12pt; font-weight: 700; margin: 12px 0 4px; page-break-after: avoid; }
  #printArea table { width: 100%; border-collapse: collapse; font-size: 7.6pt; }
  #printArea th, #printArea td { border: 1px solid #888; padding: 2.5px 4px; text-align: center; }
  #printArea th { background: #dde7f5 !important; font-weight: 700; }
  #printArea tr { page-break-inside: avoid; }
  #printArea td.wrapc { text-align: left; max-width: 200px; white-space: normal; word-break: break-all; }
  #printArea .pbar { display: flex; height: 12px; border: 1px solid #999; border-radius: 3px; overflow: hidden; }
  #printArea .pbar span { height: 100%; }
  #printArea .plegend { font-size: 8pt; margin: 3px 0 6px; }
  #printArea .plegend i { display: inline-block; width: 8px; height: 8px; margin: 0 3px 0 8px; }
}
@media (max-width: 640px) {
  .wrap { padding: 10px 12px; }
  header.top { gap:8px; }
  header.top h1 { font-size:17px; }
  header.top .sub { font-size:11px; }
  header.top .seg { order:5; width:100%; display:flex; }
  header.top .seg button { flex:1; padding:8px 4px; font-size:12px; }
  .cards { grid-template-columns: 1fr 1fr; gap:8px; }
  .kpis { grid-template-columns: 1fr 1fr; gap:8px; }
  .kpi .v { font-size:21px; }
  .kpi svg.spark { display:none; }
  .cqwrap { max-height: 68vh; }
  .card { padding:11px 12px; border-radius:10px; }
  .card .v { font-size:20px; }
  .card .k { font-size:11px; }
  .card .d { font-size:11px; }
  .panel { padding:12px; border-radius:10px; }
  nav.tabs button { padding:9px 13px; font-size:13px; }
  .controls { gap:8px; }
  .controls label { flex:1 1 44%; min-width:130px; }
  .controls input, .controls select { width:100%; }
  .controls input[type=date] { width:100%; }
  .controls .btn { flex:1 1 100%; padding:11px; }
  .legend { gap:8px 10px; font-size:11px; }
  table.tbl { font-size:12px; }
  table.tbl th, table.tbl td { padding:6px; }
  .drop { padding:28px 14px; }
  .pager { justify-content:center; }
  .pager .iconbtn { padding:9px 14px; }
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div style="font-size:38px">📦</div>
    <h2>發送誤裝訂統計分析</h2>
    <div class="seg" style="display:flex;width:100%;margin:14px 0 12px">
      <button id="gvBtn" class="on" style="flex:1" type="button">👀 檢視模式</button>
      <button id="gaBtn" style="flex:1" type="button">🔑 管理員</button>
    </div>
    <div id="gViewer">
      <p>免密碼直接進入（僅供瀏覽，無法修改）</p>
    </div>
    <div id="gAdmin" style="display:none">
      <p>管理員可上傳、填寫回覆、匯入與修改</p>
      <input id="admAcct" type="text" inputmode="numeric" autocomplete="off" placeholder="帳號" style="letter-spacing:2px;font-size:16px;margin-bottom:8px">
      <input id="admPwd" type="password" autocomplete="off" placeholder="密碼" style="letter-spacing:2px;font-size:16px">
    </div>
    <button class="btn" id="gateGo" style="width:100%;margin-top:4px" onclick="tryLogin()">👀 直接進入</button>
    <div id="gateMsg" class="msg-err" style="margin-top:10px; font-size:13px;"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header class="top">
    <div>
      <h1>📦 發送誤裝訂統計分析</h1>
      <div class="sub" id="lastUpload">—</div>
    </div>
    <div class="spacer"></div>
    <span id="roleBadge" class="pill" style="display:none"></span>
    <button class="iconbtn" id="logoutBtn" style="display:none" onclick="logout()">登出</button>
    <div class="seg" id="rangeSeg">
      <button data-r="7">近7個工作日</button>
      <button data-r="20" class="on">近20個工作日</button>
      <button data-r="0">全部</button>
    </div>
    <button class="iconbtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="chquery" class="on">🏭 彰化轉運中心追蹤</button>
    <button data-t="overview">總覽</button>
    <button data-t="changhua">彰嘉區分析</button>
    <button data-t="rank">排行榜</button>
    <button data-t="detail">明細查詢</button>
    <button data-t="upload">上傳資料</button>
  </nav>

  <div id="tab-overview" style="display:none"></div>
  <div id="tab-changhua" style="display:none"></div>
  <div id="tab-chquery"><div class="loading">載入中…</div></div>
  <div id="tab-rank" style="display:none"></div>

// ---------- 基礎 ----------
async function api(action, payload = {}) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ passcode: pass, action, ...payload }),
  });
  const j = await res.json().catch(() => ({ error: "回應解析失敗" }));
  if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
  return j;
}
const fmtN = n => (n ?? 0).toLocaleString("zh-Hant");
const fmtP = r => (r == null || !isFinite(r)) ? "—" : (r * 100).toFixed(2) + "%";
const fmtPP = d => (d >= 0 ? "+" : "") + (d * 100).toFixed(2) + "pp";
const md = d => d ? d.slice(5).replace("-", "/") : "";
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const stName = s => s === "彰轉" ? "彰化(彰轉)" : s === "彰化低溫" ? "彰化(低溫)" : s; // 彰化系歸戶標示

// ---------- 登入（檢視模式＝通行碼／管理員＝帳號密碼） ----------
let isAdmin = false;

async function tryLogin() {
  let v;

    const a = document.getElementById("admAcct").value.trim();

// ---------- 資料載入與整理 ----------
async function loadDashboard() {
  const j = await api("dashboard");
  allStats = j.stats || [];
  uploads = j.uploads || [];
  allDates = [...new Set(allStats.map(s => s.stat_date))].sort();
  detailDates = (j.detail_dates || []).map(r => ({ d: r.k, cnt: Number(r.cnt) })).sort((a, b) => a.d.localeCompare(b.d));
  lastLoadTs = Date.now();
  const u = uploads[0];
  const sL = allDates[allDates.length - 1] || "—";
  const dL = detailDates.length ? detailDates[detailDates.length - 1].d : "—";
  const range = (dL !== "—" && dL > sL) ? `統計至 ${sL}・明細至 ${dL}` : `最新資料：${sL}`;
  document.getElementById("lastUpload").textContent = u
    ? `${range}　（${new Date(u.uploaded_at).toLocaleString("zh-Hant",{hour12:false})} 上傳）`
    : "尚無資料，請先上傳";
}
function latestDataDate() {
  const a = allDates[allDates.length - 1] || "";
  const b = detailDates.length ? detailDates[detailDates.length - 1].d : "";
  return (a > b ? a : b) || "";
}
function rangeDates() {
  if (!rangeN) return allDates;
  return allDates.slice(-rangeN);
}
function pick(scope, region, station) {
  const m = new Map();
  for (const s of allStats) {
    if (s.scope !== scope) continue;
    if (region != null && s.region_name !== region) continue;
    if (station != null && s.station_name !== station) continue;
    m.set(s.stat_date, s);
  }
  return m;
}
function rateOf(s) { return s && s.sent_count > 0 ? s.err_count / s.sent_count : null; }
function stationsOf(region) {
  return [...new Set(allStats.filter(s => s.scope === "station" && s.region_name === region).map(s => s.station_name))];
}

// ---------- 共用圖表 (SVG) ----------
const tip = document.getElementById("tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 10;
  if (top + r.height > innerHeight - 8) top = y - r.height - 10;
  tip.style.left = left + scrollX + "px"; tip.style.top = top + scrollY + "px";
}
function hideTip() { tip.style.display = "none"; }

function niceTicks(max, n = 4) {
  if (max <= 0) max = 1;
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = []; for (let v = 0; v <= max + 1e-12; v += step) ticks.push(v);
  return ticks;
}

// 折線圖：series = [{name, colorVar, data: Map(date→value|null)}]，dates 統一
function lineChart(el, dates, series, opts = {}) {
  const W = Math.max(el.clientWidth || 600, 320), H = opts.h || 250;
  const M = { l: 46, r: 14, t: 10, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  let max = 0;
  series.forEach(s => dates.forEach(d => { const v = s.data.get(d); if (v != null && v > max) max = v; }));
  const ticks = niceTicks(max * 1.12);
  const ymax = ticks[ticks.length - 1] || 1;
  const X = i => dates.length === 1 ? M.l + pw / 2 : M.l + pw * i / (dates.length - 1);
  const Y = v => M.t + ph - ph * v / ymax;
  const fmt = opts.fmt || fmtP;
  let g = "";
  ticks.forEach(t => {
    g += `<line x1="${M.l}" y1="${Y(t)}" x2="${W - M.r}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${M.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t)}</text>`;
  });
  const skip = Math.ceil(dates.length / 9);
  dates.forEach((d, i) => {
    if (i % skip === 0 || i === dates.length - 1)
      g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${md(d)}</text>`;
  });
  g += `<line x1="${M.l}" y1="${M.t + ph}" x2="${W - M.r}" y2="${M.t + ph}" stroke="var(--axis)" stroke-width="1"/>`;
  series.forEach(s => {
    let path = "", pen = false;
    dates.forEach((d, i) => {
      const v = s.data.get(d);
      if (v == null) { pen = false; return; }
      path += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      pen = true;
    });
    g += `<path d="${path}" fill="none" stroke="var(${s.colorVar})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = [...dates.keys()].reverse().find(i => s.data.get(dates[i]) != null);
    if (li != null) g += `<circle cx="${X(li)}" cy="${Y(s.data.get(dates[li]))}" r="3" fill="var(${s.colorVar})"/>`;
  });
  g += `<line id="ch" x1="0" y1="${M.t}" x2="0" y2="${M.t + ph}" stroke="var(--axis)" stroke-width="1" style="display:none"/>`;
  series.forEach((s, si) => {
    g += `<circle id="hd${si}" r="4" fill="var(${s.colorVar})" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
  });
  let legend = "";
  if (series.length > 1) {
    legend = `<div class="legend">` + series.map(s =>
      `<span class="it"><span class="sw" style="background:var(${s.colorVar})"></span>${esc(s.name)}</span>`).join("") + `</div>`;
  }
  el.innerHTML = legend + `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}<rect id="ov" x="${M.l}" y="${M.t}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  const svg = el.querySelector("svg"), ov = el.querySelector("#ov");
  const ch = el.querySelector("#ch");
  ov.addEventListener("mousemove", e => {
    const box = svg.getBoundingClientRect();
    const sx = (e.clientX - box.left) * W / box.width;
    let bi = 0, bd = 1e9;
    dates.forEach((d, i) => { const dx = Math.abs(X(i) - sx); if (dx < bd) { bd = dx; bi = i; } });
    ch.setAttribute("x1", X(bi)); ch.setAttribute("x2", X(bi)); ch.style.display = "";
    let rows = "";
    series.forEach((s, si) => {
      const v = s.data.get(dates[bi]);
      const dot = el.querySelector("#hd" + si);
      if (v == null) { dot.style.display = "none"; return; }
      dot.setAttribute("cx", X(bi)); dot.setAttribute("cy", Y(v)); dot.style.display = "";
      rows += `<div class="row"><span><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${s.colorVar})"></span> ${esc(s.name)}</span><b>${fmt(v)}</b></div>`;
    });
    showTip(`<div class="tt-t">${dates[bi]}</div>` + rows, e.clientX, e.clientY);
  });
  ov.addEventListener("mouseleave", () => {
    hideTip(); ch.style.display = "none";
    series.forEach((s, si) => el.querySelector("#hd" + si).style.display = "none");
  });
}

// 直條圖：items = [{label, value, colorVar, tipHtml}]
function barChartV(el, items, opts = {}) {
  const W = Math.max(el.clientWidth || 600, 320), H = opts.h || 230;
  const M = { l: 46, r: 10, t: 20, b: 26 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const max = Math.max(...items.map(i => i.value), 0);
  const ticks = niceTicks(max * 1.1);
  const ymax = ticks[ticks.length - 1] || 1;
  const fmt = opts.fmt || fmtP;
  const bw = Math.min(46, pw / items.length - 8);
  let g = "";
  ticks.forEach(t => {
    const y = M.t + ph - ph * t / ymax;
    g += `<line x1="${M.l}" y1="${y}" x2="${W - M.r}" y2="${y}" stroke="var(--grid)"/>`;
    g += `<text x="${M.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t)}</text>`;
  });
  items.forEach((it, i) => {
    const cx = M.l + pw * (i + 0.5) / items.length;
    const h = ph * it.value / ymax;
    const y = M.t + ph - h, x = cx - bw / 2;
    const r = Math.min(4, h);
    g += `<path class="bar" data-i="${i}" d="M${x} ${M.t + ph} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + bw - r} ${y} Q${x + bw} ${y} ${x + bw} ${y + r} L${x + bw} ${M.t + ph} Z" fill="var(${it.colorVar || "--s1"})"/>`;
    g += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${fmt(it.value)}</text>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--${it.hl ? "ink" : "muted"})" ${it.hl ? 'font-weight="700"' : ""}>${esc(it.label)}</text>`;
  });
  g += `<line x1="${M.l}" y1="${M.t + ph}" x2="${W - M.r}" y2="${M.t + ph}" stroke="var(--axis)"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
  el.querySelectorAll(".bar").forEach(b => {
    b.addEventListener("mousemove", e => {
      const it = items[+b.dataset.i];
      showTip(it.tipHtml || `<div class="tt-t">${esc(it.label)}</div><div class="row"><span>數值</span><b>${fmt(it.value)}</b></div>`, e.clientX, e.clientY);
    });
    b.addEventListener("mouseleave", hideTip);
  });
}

// 橫條圖（排行）：items = [{label, value, sub, hl}]
function barChartH(el, items, opts = {}) {
  const fmt = opts.fmt || fmtN;
  const max = Math.max(...items.map(i => i.value), 1);
  el.innerHTML = items.map((it, i) => `
    <div class="hrow" data-i="${i}" style="display:flex;align-items:center;gap:8px;margin:5px 0;cursor:default">
      <div style="width:clamp(78px,22vw,110px);text-align:right;font-size:12px;color:var(--${it.hl ? "ink" : "ink-2"});${it.hl ? "font-weight:700" : ""};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.label)}</div>
      <div style="flex:1;height:16px;position:relative">
        <div style="position:absolute;inset:0 auto 0 0;width:${(it.value / max * 100).toFixed(1)}%;background:var(${it.hl ? "--s5" : "--s1"});border-radius:0 4px 4px 0;min-width:2px"></div>
      </div>
      <div style="width:74px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums">${fmt(it.value)}${it.sub ? ` <span style="color:var(--muted)">${esc(it.sub)}</span>` : ""}</div>
    </div>`).join("");
  el.querySelectorAll(".hrow").forEach(r => {
    r.addEventListener("mousemove", e => {
      const it = items[+r.dataset.i];
      if (it.tipHtml) showTip(it.tipHtml, e.clientX, e.clientY);
    });
    r.addEventListener("mouseleave", hideTip);
  });
}

// ---------- KPI ----------
function kpiCard(k, v, deltaHtml) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${deltaHtml || "&nbsp;"}</div></div>`;
}
function deltaRate(cur, prev, prevDate) {
  if (cur == null || prev == null) return "";
  const d = cur - prev, down = d < 0;
  return `<span class="${down ? "down" : "up"}">${down ? "▼" : "▲"} ${fmtPP(d)}</span> vs ${md(prevDate)}`;
}

// ---------- 總覽 ----------
function renderOverview() {
  const el = document.getElementById("tab-overview");
  const dates = rangeDates();
  if (!dates.length) { el.innerHTML = `<div class="panel">尚無資料，請先到「上傳資料」頁上傳 xlsx。</div>`; return; }
  const comp = pick("company", "全公司", "");
  const L = dates[dates.length - 1], P = dates[dates.length - 2];
  const cl = comp.get(L), cp = P ? comp.get(P) : null;
  const dL = latestDataDate();
  const newerDetails = detailDates.filter(x => x.d > L);
  const banner = newerDetails.length ? `
    <div class="panel" style="border-left:4px solid var(--s4)">
      <b>📬 ${newerDetails.map(x => `${md(x.d)} 明細 ${fmtN(x.cnt)} 筆`).join("、")} 已入庫</b>
      <div class="hint" style="margin:4px 0 0">該檔為 .xls 明細匯出（無發送筆數），趨勢與誤裝率圖表待上傳當日 xlsx 統計檔後更新；「排行榜」「彰嘉區分析」「明細查詢」已包含這些資料。</div>
    </div>` : "";
  const html = banner + `
    <div class="cards">
      ${kpiCard(`發送筆數（${md(L)}）`, fmtN(cl?.sent_count), P ? `前一工作日 ${fmtN(cp?.sent_count)}` : "")}
      ${kpiCard(`誤裝訂筆數（${md(L)}）`, fmtN(cl?.err_count), P ? `前一工作日 ${fmtN(cp?.err_count)}` : "")}
      ${kpiCard(`誤裝訂率（${md(L)}）`, fmtP(rateOf(cl)), deltaRate(rateOf(cl), rateOf(cp), P))}
      ${kpiCard(`期間平均誤裝訂率`, fmtP(avgRate(comp, dates)), `${md(dates[0])}～${md(L)}`)}
    </div>

function mapRate(m) {
  const out = new Map();
  m.forEach((s, d) => out.set(d, rateOf(s)));
  return out;
}
function avgRate(m, dates) {
  let sent = 0, err = 0;
  dates.forEach(d => { const s = m.get(d); if (s) { sent += s.sent_count; err += s.err_count; } });
  return sent ? err / sent : null;
}
function regionTable(el, L, P) {
  const rows = REGIONS.map(r => {
    const m = pick("region", r, "");
    const s = m.get(L), p = P ? m.get(P) : null;
    return { r, s, rate: rateOf(s), prev: rateOf(p) };
  }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  el.innerHTML = `<table class="tbl"><thead><tr><th>區</th><th class="num">發送筆數</th><th class="num">誤裝訂</th><th class="num">誤裝訂率</th><th class="num">前日率</th><th class="num">變化</th></tr></thead><tbody>` +
    rows.map(x => {
      const d = (x.rate != null && x.prev != null) ? x.rate - x.prev : null;
      return `<tr${x.r === "彰嘉區" ? ' style="background:rgba(232,123,164,.08)"' : ""}>
        <td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(${RCOLOR[x.r]});margin-right:6px"></span>${x.r === "彰嘉區" ? `<b>${x.r}</b>` : x.r}</td>
        <td class="num">${fmtN(x.s?.sent_count)}</td><td class="num">${fmtN(x.s?.err_count)}</td>
        <td class="num"><b>${fmtP(x.rate)}</b></td><td class="num">${fmtP(x.prev)}</td>
        <td class="num">${d == null ? "—" : `<span style="color:var(--${d < 0 ? "good" : "bad"})">${d < 0 ? "▼" : "▲"} ${fmtPP(d)}</span>`}</td></tr>`;
    }).join("") + `</tbody></table>`;

function specialTable(el, L) {

let stSort = { key: "rate", dir: -1 };
let stMinOn = true;
function stationRateTable(el, dates) {
  const agg = new Map();
  for (const s of allStats) {
    if ((s.scope !== "station" && s.scope !== "special") || !dates.includes(s.stat_date)) continue;
    const k = s.station_name;
    const o = agg.get(k) || { st: k, region: s.scope === "special" ? "特殊站" : s.region_name, sent: 0, err: 0 };
    o.sent += s.sent_count; o.err += s.err_count;
    agg.set(k, o);
  }
  let rows = [...agg.values()].map(o => ({ ...o, rate: o.sent ? o.err / o.sent : null }));
  if (stMinOn) rows = rows.filter(r => r.sent >= 1000);
  rows.sort((a, b) => ((b[stSort.key] ?? -1) - (a[stSort.key] ?? -1)) * -stSort.dir);
  const th = (label, key) => `<th class="num sortable" data-k="${key}" style="cursor:pointer">${label}${stSort.key === key ? (stSort.dir < 0 ? " ▼" : " ▲") : ""}</th>`;
  el.innerHTML = `<table class="tbl"><thead><tr><th>#</th><th>發送站</th><th>區</th>${th("發送筆數", "sent")}${th("誤裝訂", "err")}${th("誤裝訂率", "rate")}</tr></thead><tbody>` +
    rows.map((x, i) => `<tr${x.region === "彰嘉區" ? ' style="background:rgba(232,123,164,.08)"' : ""}>
      <td>${i + 1}</td><td>${x.region === "彰嘉區" ? `<b>${esc(x.st)}</b>` : esc(x.st)}</td><td><span class="pill">${esc(x.region)}</span></td>
      <td class="num">${fmtN(x.sent)}</td><td class="num">${fmtN(x.err)}</td><td class="num"><b>${fmtP(x.rate)}</b></td></tr>`).join("") +
    `</tbody></table>`;
  el.querySelectorAll(".sortable").forEach(h => h.addEventListener("click", () => {
    const k = h.dataset.k;
    if (stSort.key === k) stSort.dir *= -1; else stSort = { key: k, dir: -1 };
    stationRateTable(el, dates);
  }));
}

const unitOrder = u => {
  if (!u) return 99;
  const i = UNIT_OPTS.indexOf(u);
  return i >= 0 ? i : 50;
};
// 可排序欄位：責任單位依固定順序；其餘依「相同值聚集、筆數多的在前」，空值一律最後
const SORT_COLS = {
  resp_unit: { label: "責任單位", tip: "依單位排序（發轉→到轉→冷鏈→籠車）" },
  reply: { label: "誤裝誤訂原因", tip: "相同原因聚在一起，筆數多的在前" },
  improve: { label: "改善方式", tip: "相同改善方式聚在一起，筆數多的在前" },
  resp_station: { label: "責任站", tip: "相同責任站聚在一起，筆數多的在前" },
  note_station: { label: "註區站", tip: "相同註區站聚在一起，筆數多的在前" },
  dest_station: { label: "到著站", tip: "相同到著站聚在一起，筆數多的在前" },
};
// 多層排序：依 chqSort 順序逐層比較
function sortRows(rows) {
  if (!chqSort.length) return rows;
  const tie = (a, b) => a.send_date.localeCompare(b.send_date) || (a.seq ?? 0) - (b.seq ?? 0);
  // 每個排序層預先算出該欄各值的筆數（相同值聚集、多者在前）
  const freqs = {};
  chqSort.forEach(({ key }) => {
    if (key === "resp_unit") return;
    const f = {};
    rows.forEach(r => { const v = (r[key] || "").trim(); if (v) f[v] = (f[v] || 0) + 1; });
    freqs[key] = f;
  });
  const cmpLayer = ({ key, dir }, a, b) => {
    if (key === "resp_unit") {
      return (unitOrder(a.resp_unit) - unitOrder(b.resp_unit)) * dir
        || (a.resp_unit || "").localeCompare(b.resp_unit || "") * dir;
    }
    const va = (a[key] || "").trim(), vb = (b[key] || "").trim();
    if (!va !== !vb) return va ? -1 : 1;                       // 空值恆在最後
    if (!va) return 0;
    const f = freqs[key];
    return (f[vb] - f[va]) * dir || va.localeCompare(vb, "zh-Hant") * dir;
  };
  return rows.sort((a, b) => {
    for (const layer of chqSort) { const c = cmpLayer(layer, a, b); if (c) return c; }
    return tie(a, b);
  });
}

      </tr></thead><tbody>` +

        <td><b>${esc(chName(r.resp_station))}</b></td>

      if (i < 0) chqSort = [...chqSort, { key: k, dir: 1 }];
      else if (chqSort[i].dir === 1) chqSort = chqSort.map((s, j) => j === i ? { key: k, dir: -1 } : s);

// ---------- 回覆樞紐分析（關鍵字自動分類） ----------
const REASON_RULES = [
  // 順序即優先權：由實際回覆歸納，逐條可調
  { k: "非本所責任", re: /無誤|非本所|前站|來貨誤/, cv: "--s3" },
  { k: "彰籠RJ人工分貨疏失", re: /RJ|人工分貨/i, cv: "--s8" },
  { k: "堆疊/籠板錯誤", re: /堆疊|疊籠|籠板|疊板|疊貨/, cv: "--s2" },
  { k: "相鄰滑道", re: /相鄰|隔壁|滑道/, cv: "--s4" },
  { k: "簡碼/標示錯誤", re: /誤寫|寫錯|簡碼錯|標示錯|誤植/, cv: "--s7" },
  { k: "誤掃誤訂", re: /誤掃|掃錯|誤訂|條碼/, cv: "--s5" },
  { k: "上錯櫃/轉運", re: /誤上|上錯|裝錯|誤裝/, cv: "--s1" },
  { k: "同站所/非誤裝", re: /同站所|同站|正確|無異常|正常/, cv: "--s6" },
  { k: "漏發/未發送", re: /未發|漏發|未上車|漏上/, cv: "--bad" },
  { k: "追加/變更", re: /追加|變更|改站|改配/, cv: "--good" },
  { k: "漏掃", re: /漏刷|漏掃/, cv: "--accent" },
  { k: "標籤/外裝", re: /標籤|破損|外箱/, cv: "--axis" },
];
const CAT_OTHER = { k: "其他", cv: "--axis" };
const CAT_EMPTY = { k: "未填原因", cv: "--muted" };
const CAT_LIST = [...REASON_RULES.map(r => ({ k: r.k, cv: r.cv })), CAT_OTHER, CAT_EMPTY];
const catColor = k => (CAT_LIST.find(c => c.k === k) || CAT_OTHER).cv;
function classifyReason(t) {
  const s = (t || "").trim();
  if (!s) return CAT_EMPTY.k;
  for (const r of REASON_RULES) if (r.re.test(s)) return r.k;
  return CAT_OTHER.k;
}
// 彰籠RJ人工分貨疏失：回覆常帶「/信林A5A6」標記人力公司與籠位
const RJ_COMPANIES = ["信林", "有根", "丞閎"];
function rjTag(reply) {

  const to = document.getElementById("fzTo").value || latestDataDate() || "2100-12-31";
  const key = from + "|" + to;

  FZ_CHUTES.forEach(c => {
    const lbs = [...new Set(c.codes.map(cd => FZ_LEGEND[cd]).filter(Boolean).map(nm => FZ_ST2CH[nm]))];
    lbs.forEach(lb => { if (seenCh.has(lb) && !labels.includes(lb)) labels.push(lb); });

  if (seenCh.has(FZ_NOMAP)) labels.push(FZ_NOMAP);

  const rank = {};
  labels.filter(l => l !== FZ_NOMAP).sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0)).forEach((l, i) => { if (cnt[l]) rank[l] = i + 1; });

  labels.slice().sort((a, b) => (a === FZ_NOMAP) - (b === FZ_NOMAP) || (cnt[b] || 0) - (cnt[a] || 0)).forEach(l => {
    const n = cnt[l] || 0, top = rank[l] === 1, isNo = l === FZ_NOMAP;

    mt += `<tr${st}><td>${esc(l)}${top ? " 🔺" : ""}</td><td style="white-space:normal;max-width:220px;font-size:12px">${isNo ? "註區站不在滑道圖上" : esc(fzLabelOf(l))}</td>${BC.bs.map(b => { const v = cv(l, b); return `<td class="num">${v || "·"}</td>`; }).join("")}<td class="num"><b>${n}</b></td><td class="num">${isNo ? "—" : pct(n, mapped)}</td><td class="num">${rank[l] || "—"}</td></tr>`;

function buildFzSheets(wb, S, g) {   // S = {from, to, rows}（rows＝發轉責任件）

  const dates = [...new Set(items.map(r => r.send_date))].sort();
  const cnt = {};
  items.forEach(r => { cnt[r._ch + "|" + r.send_date] = (cnt[r._ch + "|" + r.send_date] || 0) + 1; cnt[r._ch] = (cnt[r._ch] || 0) + 1; });
  const labels = [...new Set(items.map(i => i._ch))].sort((a, b) => (a === FZ_NOMAP) - (b === FZ_NOMAP) || (cnt[b] || 0) - (cnt[a] || 0));
  const mapped = items.filter(i => i._ch !== FZ_NOMAP).length;
  const BC = bucketCols(dates, g);
  const cv = (l, b) => BC.days(b).reduce((s, d) => s + (cnt[l + "|" + d] || 0), 0);
  const a1 = [[X(`彰化轉運中心 發轉滑道分析（${S.from}～${S.to}・${GRAN_ZH[g]}檢視）`, { fill: "1F4E79", color: "FFFFFF", sz: 14 })],
    [X(`發轉件 ${S.rows.length} 筆${S.excl ? `（已排除非本所責任 ${S.excl} 筆）` : ""}・可對應滑道 ${mapped} 筆（依註區站對應滑道歸戶）`, { sz: 12 })], [],
    [H("排名"), H("滑道"), H("服務站所"), ...BC.bs.map(b => H(bucketLabel(b, g))), H("累計"), H("占比")]];
  labels.forEach((l, i) => {
    const n = cnt[l] || 0, top = i === 0 && l !== FZ_NOMAP, isNo = l === FZ_NOMAP;
    const o = top ? { fill: "FDE2E2", color: "B42318" } : {};
    a1.push([X(isNo ? "—" : i + 1, o), X(l + (top ? " ▲" : ""), { ...o, left: true }), X(isNo ? "註區站不在滑道圖上" : fzLabelOf(l), { ...o, left: true }), ...BC.bs.map(b => X(cv(l, b), o)), X(n, { ...o, fill: o.fill || "F2F2F2" }), X(isNo ? "—" : pct(n, mapped), o)]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(a1);
  autoFitSheet(ws1, a1, { skipRows: [0, 1], wrapCols: [2], rowHpts: { 0: 30, 1: 22, 2: 8, 3: 26 }, baseHpt: 22 });
  ws1["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: BC.bs.length + 5 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: BC.bs.length + 5 } }];
  XLSX.utils.book_append_sheet(wb, ws1, "滑道排行");
  const a2 = [["發送日", "十碼貨號", "誤流站(註區站)", "滑道", "應到站", "回覆原文"].map(H)];
  items.sort((a, b) => a.send_date.localeCompare(b.send_date)).forEach(i => a2.push([X(md(i.send_date)), X(i.tracking_no), X(stName(i.note_station)), X(i._ch), X(i.dest_station || ""), X(i.reply || "", { left: true })]));
  const ws2 = XLSX.utils.aoa_to_sheet(a2);
  autoFitSheet(ws2, a2, { wrapCols: [5], rowHpts: { 0: 24 }, baseHpt: 20 });

function yearLineSVG(labels, series) {

  const mx = Math.max(1, ...series.flatMap(s => s.vals));
  const x = i => P.l + (labels.length === 1 ? 0 : i / (labels.length - 1) * (W - P.l - P.r));

  const paths = series.map(s => {
    const pts = s.vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = s.vals.map((v, i) => v ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="var(${s.color})"><title>${s.name}・${labels[i]}：${v} 筆</title></circle>` : "").join("");
    return `<polyline points="${pts}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` + dots;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img">${grid}${xt}${paths}</svg>`;
}

function cageType(reply) {

    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    let hi = -1, cols = {};
    for (let i = 0; i < Math.min(grid.length, 6); i++) {
      const row = (grid[i] || []).map(v => String(v ?? "").trim());
      if (row.includes("十碼貨號")) {
        hi = i;
        row.forEach((h, c) => {
          if (h.includes("十碼貨號")) cols.no = c;
          else if (h.includes("發送日期")) cols.sd = c;
          else if (h.includes("責任單位")) cols.unit = c;
          else if (h.includes("原因")) cols.reason = c;
          else if (h.includes("改善")) cols.improve = c;
        });
        break;
      }
    }
    if (hi < 0 || cols.no == null || cols.sd == null) throw new Error("找不到「十碼貨號／發送日期」標題列，請確認是單位填寫檔格式。");
    const items = [];
    for (let i = hi + 1; i < grid.length; i++) {
      const row = grid[i] || [];
      const sd = xYmd(row[cols.sd]);
      let no = row[cols.no];
      if (no == null || !sd) continue;

      const reason = cols.reason != null ? xTxt(row[cols.reason]) : null;
      const improve = cols.improve != null ? xTxt(row[cols.improve]) : null;

    let matched = 0, missed = 0;

      msg.textContent = `匯入中… ${Math.min(i + 100, items.length)}/${items.length}`;
    }
    msg.innerHTML = `<span class="msg-ok">✅ 匯入完成：${fmtN(items.length)} 筆填寫、對到 ${fmtN(matched)} 筆明細${missed ? `、<span class="msg-err">${missed} 筆對不到（貨號/日期不符）</span>` : ""}。</span>`;
    chqState.offset = 0;
    queryChq();
    loadPivot(true);
    loadAttr(true);
    loadCage(true);
    loadFz(true);
  } catch (e) {
    msg.innerHTML = `<span class="msg-err">匯入失敗：${esc(e.message)}</span>`;
  }
}

function serialToYmd(n) {
  const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);

}
function xYmd(v) {

  if (typeof v === "number") {
    if (v >= 19000000) { const s = String(v); return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`; }
    if (v > 20000 && v < 80000) return serialToYmd(v);
    return null;
  }
  const s = String(v).trim();
  if (/^\d{8}$/.test(s)) return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`;
  return null;
}
function xHms(v) {

  if (/^\d{5,6}$/.test(s)) { s = s.padStart(6, "0"); return `${s.slice(0, 2)}:${s.slice(2, 4)}:${s.slice(4, 6)}`; }
  return s || null;
}
function xTxt(v) {

  const s = String(v).replace(/　/g, " ").trim();

}
// 貨物追蹤系統匯出的 HTML 偽 xls：19 欄明細、無統計表、無區欄
function parseHtmlDetail(text) {
  const unText = s => {
    const m = s.match(/^=TEXT\((\d*),"(0+)"\)$/);
    return m ? (m[1] ? m[1].padStart(m[2].length, "0") : "") : s;
  };
  const detailsBy = {};
  let detTotal = 0;
  const trRe = /<tr[^>]*>([\s\S]*?)<\/tr>/g;
  let tr;
  while ((tr = trRe.exec(text))) {
    const tds = [...tr[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(m =>
      unText(m[1].replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/ /g, " ").trim()));
    if (tds.length < 19) continue;
    // 0序號 1責任站 2作業日 3作業時間 4十碼貨號 5發送日期 6發送站 7寄貨人 8收貨地址 9發送件數
    // 10到著站 11註區站 12註區件數 13註區碼 14註區日 15註區時間 16註區人員 17責任站回覆 18商品別
    const sd = xYmd(tds[5]);
    if (!sd || !/^\d+$/.test(tds[0])) continue;
    const st = xTxt(tds[6]);
    const [rc, rn] = STATION_REGION[st] || [null, null];
    (detailsBy[sd] = detailsBy[sd] || []).push({
      region_code: rc, region_name: rn,
      resp_station: xTxt(tds[1]), seq: parseInt(tds[0], 10),
      work_date: xYmd(tds[2]), work_time: xHms(tds[3]),
      tracking_no: xTxt(tds[4]), send_station: st,
      sender: xTxt(tds[7]), address: xTxt(tds[8]),
      pieces: /^\d+$/.test(tds[9]) ? parseInt(tds[9], 10) : null,
      dest_station: xTxt(tds[10]), note_station: xTxt(tds[11]),
      note_code: xTxt(tds[13]), note_date: xYmd(tds[14]), note_time: xHms(tds[15]),
      note_staff: xTxt(tds[16]), reply: xTxt(tds[17]), product_type: xTxt(tds[18]),
    });
    detTotal++;
  }
  return { detailsBy, detTotal };
}

      const m = file.name.match(/(\d{8})/);
      const fileDate = m ? `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}` : Object.keys(detailsBy).sort().pop();

    const st = XLSX.utils.sheet_to_json(wb.Sheets["統計表"], { header: 1, raw: true, defval: null });

    // ---- 統計表 ----

    for (let c = 5; c < hdr.length; c++) {

      const row = st[r] || [];

      else { scope = "station"; code = Number(b) || 0; region = cn; station = dn; }

      (detailsBy[sd] = detailsBy[sd] || []).push({
        region_code: typeof row[0] === "number" ? row[0] : null,
        region_name: xTxt(row[2]), resp_station: xTxt(row[4]), seq: Math.round(seq),
        work_date: xYmd(row[5]), work_time: xHms(row[6]),
        tracking_no: xTxt(row[7]), send_station: xTxt(row[9]),
        sender: xTxt(row[10]), address: xTxt(row[11]),
        pieces: typeof row[12] === "number" ? Math.round(row[12]) : null,
        dest_station: xTxt(row[13]), note_station: xTxt(row[14]),
        note_code: xTxt(row[16]), note_date: xYmd(row[17]), note_time: xHms(row[18]),
        note_staff: xTxt(row[19]), reply: xTxt(row[20]), product_type: xTxt(row[21]),
      });
      detTotal++;
    }
    const m = file.name.match(/(\d{8})/);
    const fileDate = m ? `${m[1].slice(0, 4)}-${m[1].slice(4, 6)}-${m[1].slice(6, 8)}` : (Object.keys(detailsBy).sort().pop() || dateCols[dateCols.length - 1][1]);
    parsed = { stats, detailsBy, detTotal, fileDate, fileName: file.name };
    const statDays = [...new Set(stats.map(s => s.stat_date))].sort();
    pv.innerHTML = `
      <table class="tbl">
        <tr><th>檔案</th><td>${esc(file.name)}</td></tr>
        <tr><th>統計表</th><td>${fmtN(stats.length)} 筆（${statDays.length} 個工作日：${statDays[0]} ～ ${statDays[statDays.length - 1]}）</td></tr>
        <tr><th>明細</th><td>${fmtN(detTotal)} 筆（發送日：${Object.keys(detailsBy).sort().map(d => `${d}＝${fmtN(detailsBy[d].length)}筆`).join("、")}）</td></tr>
      </table>
      <div style="margin-top:10px"><button class="btn" onclick="doUpload()">✅ 確認上傳入庫</button></div>`;
  } catch (e) {
    parsed = null;
    pv.innerHTML = `<div class="msg-err">解析失敗：${esc(e.message)}</div>`;
  }
}
async function doUpload() {
  if (!parsed) return;
  const prog = document.getElementById("upProg"), bar = prog.querySelector("div"), msg = document.getElementById("upMsg");
  prog.style.display = ""; msg.innerHTML = "";
  const BATCH = 800;
  const jobs = [];
  for (let i = 0; i < parsed.stats.length; i += BATCH)
    jobs.push({ action: "upload_stats", rows: parsed.stats.slice(i, i + BATCH) });
  for (const [sd, rows] of Object.entries(parsed.detailsBy))
    for (let i = 0; i < rows.length; i += BATCH)
      jobs.push({ action: "upload_details", send_date: sd, first: i === 0, rows: rows.slice(i, i + BATCH) });
  jobs.push({ action: "log_upload", file_date: parsed.fileDate, detail_count: parsed.detTotal, stats_days: [...new Set(parsed.stats.map(s => s.stat_date))].length });
  try {
    for (let i = 0; i < jobs.length; i++) {
      await api(jobs[i].action, jobs[i]);
      bar.style.width = Math.round((i + 1) / jobs.length * 100) + "%";
    }
    msg.innerHTML = `<span class="msg-ok">✅ 上傳完成！統計 ${fmtN(parsed.stats.length)} 筆、明細 ${fmtN(parsed.detTotal)} 筆已入庫。</span>`;
    parsed = null;
    document.getElementById("upPreview").innerHTML = "";
    await loadDashboard();
    setTimeout(() => { prog.style.display = "none"; bar.style.width = "0%"; renderUpload(); }, 1200);
  } catch (e) {
    msg.innerHTML = `<span class="msg-err">上傳失敗：${esc(e.message)}（可重新解析檔案再試，同日資料會自動覆蓋不會重複）</span>`;
  }
}

// ---------- 導覽 ----------
function renderCurrent() {
  ({ overview: renderOverview, changhua: renderChanghua, chquery: renderChQuery, rank: renderRank, detail: renderDetail, upload: renderUpload })[curTab]();
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  curTab = b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["overview", "changhua", "chquery", "rank", "detail", "upload"].forEach(t =>
    document.getElementById("tab-" + t).style.display = t === curTab ? "" : "none");
  renderCurrent();
});
document.getElementById("rangeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  rangeN = +b.dataset.r;
  document.querySelectorAll("#rangeSeg button").forEach(x => x.classList.toggle("on", x === b));
  if (curTab !== "upload" && curTab !== "detail") renderCurrent();
});
let rsz;
addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (curTab === "overview" || curTab === "changhua") renderCurrent(); }, 250); });
// 回到頁面（切分頁/手機解鎖）且資料超過 3 分鐘 → 自動重新載入，避免多裝置間看到舊資料
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !pass || !lastLoadTs) return;
  if (Date.now() - lastLoadTs < 3 * 60 * 1000) return;
  try { await loadDashboard(); if (curTab !== "upload") renderCurrent(); } catch {}
});

// ---------- 主題 ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("ml_theme", t);
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  renderCurrent();
}
applyTheme(localStorage.getItem("ml_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

// ---------- 啟動 ----------
(async () => {
  if (pass) {
    try {
      await loadDashboard();
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "";
      setRoleUI();
      renderCurrent();
      return;
    } catch { localStorage.removeItem("ml_pass"); pass = ""; }
  }
})();
</script>
